<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة التحكم</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body><div class="wrap"><header class="top"><div class="brand"><span class="logo">✦</span><div><b>لوحة التحكم</b><small>إدارة العطور والطلبات</small></div></div><a class="admin-link" href="index.html">المتجر</a></header><main class="admin"><section id="loginBox" class="panel"><h2>دخول المدير</h2><p class="muted">هذه الصفحة مخصصة لصاحب المتجر فقط.</p><form id="login"><input id="email" type="email" placeholder="البريد الإلكتروني" required><input id="password" type="password" placeholder="كلمة المرور" required><button class="primary">دخول</button><p id="loginStatus" class="status"></p></form></section><section id="dashboard" class="hidden"><div class="dash-head"><div><h2>إدارة المتجر</h2><p class="muted">أضف العطور وعدّلها، واستقبل طلبات الزبائن.</p></div><button class="chip" id="logout">تسجيل الخروج</button></div><div class="panel"><h3 id="formTitle">إضافة عطر جديد</h3><form id="productForm" class="form-grid"><input type="hidden" id="editId"><label>اسم العطر<input id="name" required></label><label>الماركة<input id="brand"></label><label>الحجم<input id="size" placeholder="100ml"></label><label>السعر<input id="price" type="number" min="0" step="0.01" required></label><label>السعر قبل التخفيض<input id="oldPrice" type="number" min="0" step="0.01"></label><label>النوع<select id="type"><option value="own">تركيبتنا الخاصة</option><option value="imp">مستورد</option></select></label><label class="wide">الوصف والنوتات<textarea id="description" rows="4"></textarea></label><label class="wide">صورة العطر<input id="image" type="file" accept="image/*"></label><div class="actions wide"><button class="primary">حفظ العطر</button><button type="button" class="chip" id="cancelEdit">إلغاء</button><span id="productStatus" class="status"></span></div></form></div><div class="panel"><div class="section-head"><h3>العطور</h3><span id="productCount" class="muted"></span></div><div id="products" class="rows"></div></div><div class="panel"><div class="section-head"><h3>الطلبات</h3><button class="chip" id="refreshOrders">تحديث</button></div><div id="orders" class="orders"></div></div></section></main></div><script src="config.js"></script><script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const c=window.ROQI_CONFIG||{}; const sb=createClient(c.SUPABASE_URL,c.SUPABASE_ANON_KEY); const $=s=>document.querySelector(s); let user=null, products=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); const money=n=>Number(n).toLocaleString('fr-FR')+' '+(c.CURRENCY||'DA');
function msg(el,t){el.textContent=t}
async function isAdmin(u){const {data,error}=await sb.from('admins').select('user_id').eq('user_id',u.id).maybeSingle(); return !error&&!!data}
async function check(){const {data:{session}}=await sb.auth.getSession(); if(session?.user && await isAdmin(session.user)){user=session.user; $('#loginBox').classList.add('hidden'); $('#dashboard').classList.remove('hidden'); await Promise.all([loadProducts(),loadOrders()]);} else {$('#loginBox').classList.remove('hidden'); $('#dashboard').classList.add('hidden')}}
$('#login').onsubmit=async e=>{e.preventDefault(); const st=$('#loginStatus'); msg(st,'جارٍ الدخول...'); const {data,error}=await sb.auth.signInWithPassword({email:$('#email').value.trim(),password:$('#password').value}); if(error){msg(st,'البريد أو كلمة المرور غير صحيحة.');return} if(!(await isAdmin(data.user))){await sb.auth.signOut();msg(st,'هذا الحساب ليس مضافاً كمدير. أضف UUID في جدول admins.');return} await check()}; $('#logout').onclick=async()=>{await sb.auth.signOut(); location.reload()};
async function loadProducts(){const {data,error}=await sb.from('products').select('*').order('created_at',{ascending:false}); if(error){msg($('#productStatus'),'تعذر تحميل العطور.')} products=data||[]; $('#productCount').textContent=`${products.length} عطر`; $('#products').innerHTML=products.length?products.map(p=>`<div class="row"><div class="thumb">${p.image_url?`<img src="${esc(p.image_url)}">`:'✦'}</div><div class="row-main"><b>${esc(p.name)}</b><small>${esc(p.brand||'')} · ${money(p.price)}</small></div><button class="chip" data-edit="${p.id}">تعديل</button><button class="chip danger" data-delete="${p.id}">حذف</button></div>`).join(''):'<div class="empty">لا توجد عطور.</div>'; document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editProduct(b.dataset.edit)); document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>deleteProduct(b.dataset.delete))}
function editProduct(id){const p=products.find(x=>x.id===id); if(!p)return; $('#editId').value=p.id; $('#name').value=p.name;$('#brand').value=p.brand||'';$('#size').value=p.size||'';$('#price').value=p.price;$('#oldPrice').value=p.old_price||'';$('#type').value=p.type;$('#description').value=p.description||'';$('#formTitle').textContent='تعديل العطر'; window.scrollTo({top:0,behavior:'smooth'})}
$('#cancelEdit').onclick=()=>clearForm(); function clearForm(){['editId','name','brand','size','price','oldPrice','description','image'].forEach(id=>{const e=$('#'+id); if(e)e.value=''}); $('#type').value='own'; $('#formTitle').textContent='إضافة عطر جديد'; msg($('#productStatus'),'')}
async function uploadImage(file){if(!file)return null; const ext=(file.name.split('.').pop()||'jpg').toLowerCase(); const path=`${crypto.randomUUID()}.${ext}`; const {error}=await sb.storage.from('product-images').upload(path,file,{upsert:true,contentType:file.type}); if(error)throw error; const {data}=sb.storage.from('product-images').getPublicUrl(path); return data.publicUrl}
$('#productForm').onsubmit=async e=>{e.preventDefault(); const st=$('#productStatus'); msg(st,'جارٍ الحفظ...'); try{let imageUrl=null; const file=$('#image').files[0]; if(file) imageUrl=await uploadImage(file); const payload={name:$('#name').value.trim(),brand:$('#brand').value.trim(),size:$('#size').value.trim(),price:+$('#price').value,old_price:$('#oldPrice').value?+$('#oldPrice').value:null,type:$('#type').value,description:$('#description').value.trim()}; if(imageUrl)payload.image_url=imageUrl; const id=$('#editId').value; let result=id?await sb.from('products').update(payload).eq('id',id):await sb.from('products').insert(payload); if(result.error)throw result.error; msg(st,'تم حفظ العطر ✓'); clearForm(); await loadProducts(); }catch(err){msg(st,'تعذر الحفظ: '+(err.message||'خطأ'))}};
async function deleteProduct(id){if(!confirm('حذف هذا العطر؟'))return; const {error}=await sb.from('products').delete().eq('id',id); if(error){alert('تعذر الحذف: '+error.message);return} await loadProducts()}
async function loadOrders(){const {data,error}=await sb.from('orders').select('id,customer_name,phone,address,quantity,note,status,created_at,product_id,products(name,price)').order('created_at',{ascending:false}); if(error){$('#orders').innerHTML='<div class="empty">تعذر تحميل الطلبات.</div>';return} $('#orders').innerHTML=(data||[]).length?(data||[]).map(o=>`<div class="order-row"><div><b>${esc(o.customer_name)}</b> · ${esc(o.phone)}</div><div class="muted">${esc(o.products?.name||'عطر')} × ${o.quantity} · ${o.products?money(o.products.price*o.quantity):''}</div><div>${esc(o.address)}</div>${o.note?`<div class="muted">ملاحظة: ${esc(o.note)}</div>`:''}<div class="order-actions"><select data-status="${o.id}">${['new','confirmed','shipped','done','cancelled'].map(s=>`<option value="${s}" ${o.status===s?'selected':''}>${s}</option>`).join('')}</select><button class="chip danger" data-order-delete="${o.id}">حذف</button></div></div>`).join(''):'<div class="empty">لا توجد طلبات حتى الآن.</div>'; document.querySelectorAll('[data-status]').forEach(s=>s.onchange=async()=>{const {error}=await sb.from('orders').update({status:s.value}).eq('id',s.dataset.status); if(error)alert(error.message)}); document.querySelectorAll('[data-order-delete]').forEach(b=>b.onclick=async()=>{if(!confirm('حذف الطلب؟'))return; await sb.from('orders').delete().eq('id',b.dataset.orderDelete); loadOrders()})}
$('#refreshOrders').onclick=loadOrders; sb.auth.onAuthStateChange(()=>check()); check();
</script></body></html>
